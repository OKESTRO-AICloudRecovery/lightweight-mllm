[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lightweight-mllm"
version = "2.0.0"
description = "Cloud-operations VQA dataset builder and modality-wise benchmark (MMLU, MMMU, MMAU) for lightweight multimodal LLMs"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "OKESTRO Co., Ltd." }]
requires-python = ">=3.9"
dependencies = []
keywords = ["multimodal-llm", "vqa", "benchmark", "mmlu", "mmmu", "mmau", "aiops"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
bench = ["pandas>=1.3", "pyarrow>=8.0", "pillow", "soundfile", "huggingface_hub"]
mlx = ["mlx-vlm"]
torch = ["torch", "transformers", "accelerate", "qwen-omni-utils"]
dev = ["pytest>=7", "pandas>=1.3", "pyarrow>=8.0"]

[project.urls]
Homepage = "https://github.com/OKESTRO-AICloudRecovery/lightweight-mllm"

[tool.setuptools]
packages = ["lightweight_mllm", "lightweight_mllm.bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
